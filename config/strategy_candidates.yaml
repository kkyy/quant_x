# Strategy candidates promoted from walk-forward validation.
#
# This file is intentionally not auto-loaded by utils.config.load_config().
# It records reusable research conclusions so future runs can start from the
# current best parameter sets instead of rediscovering them from ignored
# optimization_results artifacts.

research:
  source_run: "optimization_results/walk_forward_20260428_full_wf"
  generated_on: "2026-04-28"
  method: "walk_forward"
  train_universes: ["csi300", "csi800", "csi1000"]
  eval_market: "csi300"
  folds:
    - {name: "test_2020", train: "2015-01-01..2018-12-31", valid: "2019-01-01..2019-12-31", test: "2020-01-01..2020-12-31"}
    - {name: "test_2021", train: "2015-01-01..2019-12-31", valid: "2020-01-01..2020-12-31", test: "2021-01-01..2021-12-31"}
    - {name: "test_2022", train: "2015-01-01..2020-12-31", valid: "2021-01-01..2021-12-31", test: "2022-01-01..2022-12-31"}
    - {name: "test_2023", train: "2015-01-01..2021-12-31", valid: "2022-01-01..2022-12-31", test: "2023-01-01..2023-12-31"}
    - {name: "test_2024", train: "2015-01-01..2021-12-31", valid: "2022-01-01..2023-12-31", test: "2024-01-01..2024-12-31"}
    - {name: "test_2025", train: "2015-01-01..2022-12-31", valid: "2023-01-01..2024-12-31", test: "2025-01-01..2025-12-31"}
    - {name: "test_2026", train: "2015-01-01..2023-12-31", valid: "2024-01-01..2025-12-31", test: "2026-01-01..2026-04-28"}
  strategy_grid:
    topk: [5, 15, 20]
    n_drop: [1, 3]
    hold_thresh: [5, 8, 10]
  scoring:
    robust_score: "mean_sharpe - 0.5 * sharpe_std + 0.2 * min_sharpe + 0.05 * positive_sharpe_folds"
    note: "Treat candidates as research starting points, not proof of live profitability."
  rejected_recent:
    fundamental_gate_top70:
      date: "2026-05-12"
      config: "config/ablation_fundamental_gate.yaml"
      result_source: "optimization_results/walk_forward_fundamental_gate_top70_wf/walk_forward_summary.csv"
      reason: "Same-model 2024-2026 uplift failed WFV: mean Sharpe 0.30, min Sharpe -1.20, worst MaxDD -45.5%, only 4/7 positive folds, p=0.515."
      revisit_only_if: "Use a much weaker drop-bottom gate or redo after a longer point-in-time fundamental audit; do not promote top70 gate."
    fundamental_growth_gate_drop20_cov2:
      date: "2026-05-12"
      config: "config/ablation_fundamental_growth_gate_drop20_cov2.yaml"
      result_source: "optimization_results/walk_forward_fundamental_growth_gate_drop20_cov2_wf/walk_forward_summary.csv"
      reason: "Improved the fundamental branch to mean Sharpe 0.87 and 5/7 positive folds, but still trails adaptive_baseline_wf (1.22) and adaptive_dd20_wf (0.98, 7/7 positive); 2022/2023 remain negative."
      revisit_only_if: "Only revisit with drawdown/regime gating that disables the growth filter in weak markets."

selected:
  # Highest robust_score in the completed walk-forward grid. Strong return,
  # but concentrated: 2026 attribution showed several 50%-60% single-stock weights.
  active_candidate: "csi800_aggressive_return"
  # More conservative starting point for manual trading research.
  conservative_candidate: "csi1000_balanced"
  # Strong 2024-2026 overlay, but not robust enough across 2021-2022 walk-forward
  # folds to replace the balanced baseline.
  aggressive_overlay_candidate: "csi1000_relative_strength_overlay"
  # Preferred next overlay iteration: still materially stronger than baseline,
  # but less concentrated than the topk=5 aggressive overlay.
  preferred_overlay_candidate: "csi1000_overlay_plus"
  # Best WFV stability candidate: lower mean Sharpe than adaptive baseline,
  # but all folds positive and materially lower worst drawdown.
  stability_candidate: "csi1000_adaptive_dd20"
candidates:
  csi800_aggressive_return:
    description: "Highest robust_score and highest mean return; needs position concentration controls before manual trading."
    train_universe: "csi800"
    eval_market: "csi300"
    strategy:
      topk: 5
      n_drop: 3
      hold_thresh: 8
    walk_forward:
      folds: 7
      mean_annual_return: 0.590157
      median_annual_return: 0.4222
      mean_sharpe: 1.758343
      median_sharpe: 1.5442
      min_sharpe: -0.9092
      sharpe_std: 1.841369
      worst_max_drawdown: -0.4161
      positive_return_folds: 6
      positive_sharpe_folds: 6
      mean_rank_ic: 0.038243
      mean_rank_icir: 0.301114
      robust_score: 0.955818
    suggested_next_checks:
      - "Add max single-stock weight cap around 20%-25% and rerun walk-forward."
      - "Review yearly fold PnL before using for manual stock selection."

  csi1000_balanced:
    description: "Better signal diagnostics and less severe worst drawdown than the aggressive csi800/topk5 candidate."
    train_universe: "csi1000"
    eval_market: "csi300"
    strategy:
      topk: 15
      n_drop: 3
      hold_thresh: 5
    walk_forward:
      folds: 7
      mean_annual_return: 0.223
      median_annual_return: 0.282
      mean_sharpe: 1.030171
      median_sharpe: 1.1939
      min_sharpe: -0.2974
      sharpe_std: 0.681152
      worst_max_drawdown: -0.2784
      positive_return_folds: 6
      positive_sharpe_folds: 6
      mean_rank_ic: 0.051286
      mean_rank_icir: 0.389129
      robust_score: 0.930115
    suggested_next_checks:
      - "Use as the first practical low-frequency manual-selection candidate."
      - "Compare with csi800_stable_all_positive under equal position cap."
      - "Optional overlay: enable signal.postprocess.stock_vs_sector_filter for relative-strength narrowing, but treat it as aggressive."

  csi1000_adaptive_dd20:
    description: "Drawdown-gated SVS overlay with -20% threshold; first WFV candidate with all seven folds positive."
    train_universe: "csi1000"
    eval_market: "csi300"
    base_model: "models/lgbm_universe-csi1000_20260428_155547.pkl"
    config: "config/csi1000_adaptive_overlay_20.yaml"
    signal_postprocess:
      daily_transform: "rank"
      stock_vs_sector_filter:
        enabled: true
        window: 20
        keep_top_pct: 0.5
        mode: "hard_filter"
        drawdown_threshold: -0.20
        drawdown_window: 120
    strategy:
      topk: 15
      n_drop: 3
      hold_thresh: 8
    portfolio:
      max_position_pct: 0.12
      concentration_hard_limit: 0.22
    walk_forward:
      source_run: "optimization_results/walk_forward_adaptive_dd20_wf"
      folds: 7
      mean_annual_return: 0.2056
      median_annual_return: 0.2442
      mean_sharpe: 0.984371
      median_sharpe: 0.9538
      min_sharpe: 0.0217
      sharpe_std: 0.809851
      worst_max_drawdown: -0.2347
      positive_return_folds: 7
      positive_sharpe_folds: 7
      mean_rank_ic: 0.048114
      mean_rank_icir: 0.332843
      sharpe_ttest_pvalue: 0.024721
      robust_score: 0.933786
      pareto_front: true
    rationale:
      - "Sacrifices mean Sharpe versus adaptive_baseline_wf (0.98 vs 1.22) for all-positive fold stability."
      - "Improves worst drawdown versus adaptive_baseline_wf (-23.5% vs -28.6%)."
      - "Keeps SVS as a drawdown-gated risk overlay rather than an always-on alpha assumption."
    suggested_next_checks:
      - "Run dry-run scheduled rebalance before any real notification or trading workflow."
      - "Compare current holdings impact against adaptive_baseline_wf after the next qlib data update."
      - "Keep csi1000_balanced/adaptive_baseline_wf as the return-seeking control."

  csi1000_relative_strength_overlay:
    description: "Aggressive overlay on csi1000_balanced: keep stocks in the top 40% by 20-day stock-vs-sector relative strength, then use a concentrated TopkDropout portfolio."
    train_universe: "csi1000"
    eval_market: "csi300"
    base_model: "models/lgbm_universe-csi1000_20260428_155547.pkl"
    signal_postprocess:
      daily_transform: "rank"
      stock_vs_sector_filter:
        enabled: true
        window: 20
        keep_top_pct: 0.4
    strategy:
      topk: 5
      n_drop: 5
      hold_thresh: 5
    same_model_2024_2026:
      start: "2024-01-01"
      end: "2026-04-29"
      cum_return: 3.8014
      annual_return: 1.0233
      sharpe: 3.6643
      max_drawdown: -0.0955
      rank_ic: 0.0593
    multi_seed_2024_2026:
      seeds: [42, 123, 2024, 7, 999]
      cum_return: 3.58938
      annual_return: 0.9812
      sharpe: 3.52574
      sharpe_std: 0.177762
      max_drawdown: -0.10216
    walk_forward_read:
      positive_return_folds: 5
      negative_years: ["2021", "2022"]
      note: "Strong after 2023 and very strong in 2024, but weak in 2021-2022 under yearly model replacement; do not promote as standalone default."
    artifacts:
      comparison: "optimization_results/research_cycles/stock_vs_sector_methods_comparison_20260429.md"
      robustness: "optimization_results/research_cycles/stock_vs_sector_20d_top40pct_robustness_20260429.md"
      grid: "optimization_results/research_cycles/stock_vs_sector_filter_grid_csi1000_20260429.csv"
    suggested_next_checks:
      - "Test less concentrated variants around topk=10/15 and keep_top_pct=0.4/0.5."
      - "Blend or switch with csi1000_balanced to reduce 2021-2022 regime risk."
      - "Run slippage sensitivity before any production-like use."

  csi1000_overlay_plus:
    description: "Less concentrated relative-strength overlay: keep the top 50% by 20-day stock-vs-sector strength, then use topk=10 / n_drop=5 / hold=8."
    train_universe: "csi1000"
    eval_market: "csi300"
    base_model: "models/lgbm_universe-csi1000_20260428_155547.pkl"
    config: "config/csi1000_balanced_overlay_plus.yaml"
    signal_postprocess:
      daily_transform: "rank"
      stock_vs_sector_filter:
        enabled: true
        window: 20
        keep_top_pct: 0.5
    strategy:
      topk: 10
      n_drop: 5
      hold_thresh: 8
    same_model_2024_2026_grid_read:
      cum_return: 2.5308
      annual_return: 0.7624
      sharpe: 3.2157
      max_drawdown: -0.1463
      rank_ic: 0.0534
      note: "From stock_vs_sector_filter_grid_csi1000_20260429.csv; materially above baseline and less concentrated than the topk=5 overlay."
    rationale:
      - "Compared with the baseline 15/3/5, it retains a large part of the overlay alpha uplift."
      - "Compared with the aggressive overlay 5/5/5, it reduces concentration risk by doubling breadth."
      - "Hold=8 is consistent with the stronger medium-horizon trend expression of the filter."
    suggested_next_checks:
      - "Run yearly split and walk-forward validation for this exact config, not just the same-model grid read."
      - "Compare with the baseline under equal position caps and net-cost reporting."
      - "Use as the main next-step overlay candidate before testing regime switching."

  csi1000_overlay_practical:
    description: "Practical balanced overlay: keep the top 50% by 20-day stock-vs-sector strength, then use topk=15 / n_drop=5 / hold=5."
    train_universe: "csi1000"
    eval_market: "csi300"
    base_model: "models/lgbm_universe-csi1000_20260428_155547.pkl"
    config: "config/csi1000_balanced_overlay_practical.yaml"
    signal_postprocess:
      daily_transform: "rank"
      stock_vs_sector_filter:
        enabled: true
        window: 20
        keep_top_pct: 0.5
    strategy:
      topk: 15
      n_drop: 5
      hold_thresh: 5
    same_model_2024_2026_grid_read:
      cum_return: 1.8675
      annual_return: 0.6051
      sharpe: 2.9443
      max_drawdown: -0.1291
      rank_ic: 0.0534
      note: "From stock_vs_sector_filter_grid_csi1000_20260429.csv; closest to the original balanced baseline in breadth while still clearly stronger on the same window."
    rationale:
      - "It keeps the baseline topk breadth, which should make manual selection and risk control easier."
      - "It is a stronger practical candidate than the raw baseline on the 2024-2026 same-model window."
      - "This is the safer overlay to test first if the topk=10 version still feels too concentrated."
    suggested_next_checks:
      - "Run multi-seed and year-split validation for this config."
      - "Compare turnover and slippage sensitivity against csi1000_overlay_plus."
      - "Use as fallback if the plus variant loses too much robustness in 2021-2022 walk-forward."

  csi800_stable_all_positive:
    description: "All seven folds had positive return and Sharpe, but Sharpe dispersion is high."
    train_universe: "csi800"
    eval_market: "csi300"
    strategy:
      topk: 15
      n_drop: 3
      hold_thresh: 5
    walk_forward:
      folds: 7
      mean_annual_return: 0.299071
      median_annual_return: 0.2332
      mean_sharpe: 1.225586
      median_sharpe: 0.9191
      min_sharpe: 0.0028
      sharpe_std: 1.349994
      worst_max_drawdown: -0.2672
      positive_return_folds: 7
      positive_sharpe_folds: 7
      mean_rank_ic: 0.038243
      mean_rank_icir: 0.301114
      robust_score: 0.901149
    suggested_next_checks:
      - "Rerun with multi-seed and position cap; this is a promising stability candidate."

usage:
  train_candidate_model: >
    python run_train.py --config <temporary yaml with market.name set to candidate train_universe>
    --model lgbm --no-extra-factors --tag <candidate>
  backtest_candidate: >
    python run_backtest.py --model-path models/<model>.pkl --market csi300
    --topk <topk> --n-drop <n_drop> --hold-thresh <hold_thresh>
  rerun_walk_forward: >
    ./.venv/bin/python run_walk_forward_validation.py --train-universes csi300,csi800,csi1000
    --eval-market csi300 --topk 5,15,20 --n-drop 1,3 --hold-thresh 5,8,10
