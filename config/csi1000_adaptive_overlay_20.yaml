# Adaptive drawdown-gated SVS overlay with -20% threshold.
# WFV 2026-05-05 robust winner: topk=15 / n_drop=3 / hold=8,
# 7/7 positive Sharpe folds, mean Sharpe 0.984, worst MaxDD -23.47%.
# See optimization_results/walk_forward_adaptive_dd20_wf/ for evidence.

market:
  name: "csi300"
  benchmark: "SH000300"

strategy:
  topk_dropout:
    topk: 15
    n_drop: 3
    hold_thresh: 8
  portfolio:
    max_position_pct: 0.12
    concentration_hard_limit: 0.22
  universe_filter:
    exclude_kcb: true
    exclude_list: []
    min_price: 3
    exclude_st: true
    exclude_suspended: true

signal:
  postprocess:
    enabled: true
    daily_transform: "rank"
    rank_pct: true
    industry_neutralize: false
    stock_vs_sector_filter:
      enabled: true
      window: 20
      keep_top_pct: 0.5
      mode: "hard_filter"
      drawdown_threshold: -0.20
      drawdown_window: 120

daily_rebalance:
  market: "csi300"
  topk: 15
  n_drop: 3
  hold_thresh: 8
  account: 150000
  notify_channel: "bark"
  start_date: "previous_trade_date"
  model_path: "models/lgbm_universe-csi1000_20260428_155547.pkl"
  min_action_value: 1000
