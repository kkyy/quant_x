# Aggressive relative-strength overlay for the csi1000_balanced research line.
#
# Use with the csi1000-trained baseline model, for example:
#   python run_backtest.py --config config/csi1000_balanced_overlay.yaml \
#     --model-path models/lgbm_universe-csi1000_20260428_155547.pkl
#
# This is intentionally separate from daily_csi1000.yaml because walk-forward
# validation showed weak years in 2021-2022. Treat it as a research overlay,
# not the default practical candidate.
#
# REGIME RISK WARNING (WFV evidence, 2026-05-02):
#   Same-model (2024-2026): Sharpe 3.10, MaxDD -9.8% — excellent.
#   WFV out-of-sample:       2021 Sharpe -0.71, 2022 -0.59, MaxDD -32.8%.
#   SVS filter is leverage, not alpha — it amplifies both gains and losses.
#   When drawdown exceeds -15%, consider switching to baseline config
#   (config/daily_csi1000.yaml, topk=15/n_drop=3/hold=5, no SVS).

market:
  name: "csi300"
  benchmark: "SH000300"

strategy:
  topk_dropout:
    topk: 5
    n_drop: 5
    hold_thresh: 5
  portfolio:
    max_position_pct: 0.2
    concentration_hard_limit: 0.3
  universe_filter:
    exclude_kcb: true
    exclude_list: []
    min_price: 3
    exclude_st: true
    exclude_suspended: true

signal:
  postprocess:
    enabled: true
    daily_transform: "rank"
    rank_pct: true
    industry_neutralize: false
    stock_vs_sector_filter:
      enabled: true
      window: 20
      keep_top_pct: 0.4

# Regime monitoring: compare overlay vs baseline signals daily.
# When overlay_cumulative_drawdown exceeds -15%, rebalance report will
# include a WARNING suggesting switch to baseline config.
overlay_monitor:
  enabled: true
  drawdown_threshold: -0.15
  baseline_config: "config/daily_csi1000.yaml"
  baseline_topk: 15
  baseline_n_drop: 3
  baseline_hold_thresh: 5

daily_rebalance:
  market: "csi300"
  topk: 5
  n_drop: 5
  hold_thresh: 5
  account: 150000
  notify_channel: "bark"
  # Use one warm-up trading day so qlib can create the first target position on
  # the signal day, without carrying a long historical replay from 2024.
  start_date: "previous_trade_date"
  model_path: "models/lgbm_universe-csi1000_20260428_155547.pkl"
  min_action_value: 1000