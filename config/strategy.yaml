# ============================================================
# Strategy & Backtest Configuration
# ============================================================

strategy:
  topk_dropout:
    topk: 10           # 最大持仓股票数
    n_drop: 3          # 每次调仓替换的股票数
    hold_thresh: 5     # 持股最少天数（防止频繁换手）
    method_sell: "bottom"
    method_buy: "top"

  portfolio:
    lot_size: 100                # 每手股数
    max_position_pct: 0.25       # 单只股票最大仓位比例
    equal_weight: true           # 是否等权重持仓

  universe_filter:
    exclude_kcb: true            # 排除科创板 (SH688xxx)
    exclude_st: true             # 排除ST股（需要额外数据支持）
    exclude_list:                # 手动排除的股票代码列表
      - "SZ300442"
    min_price: 2.0               # 最低股价过滤
    min_avg_volume_m: 0.5        # 最低日均成交额（百万元）

backtest:
  start_time: "2025-01-01"
  end_time: null                 # null 表示使用今天
  account: 1000000               # 初始资金（元）
  open_cost: 0.0005              # 买入手续费
  close_cost: 0.0015             # 卖出手续费（含印花税）
  min_cost: 5                    # 最低手续费（元）
