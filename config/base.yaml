# ============================================================
# Base Configuration - quant_ex
# 修改这里来配置你的数据路径、市场和实验设置
# ============================================================

qlib:
  provider_uri: "./qlib_data/qlib_bin"
  region: "cn"

data_update:
  qlib_bin:
    # 数据更新工作目录。
    # 会在其中维护 dolt clone、qlib clone、qlib_source、qlib_normalize 等中间目录。
    workspace_dir: "./qlib_data"
    qlib_repo: "https://github.com/microsoft/qlib.git"
    dolt_repo: "chenditc/investment_data"
    mysql_url: "mysql+pymysql://root:@127.0.0.1/investment_data"
    max_workers: 16
    # 默认保持原始 dolt clone 行为；如需浅克隆，可运行时显式加 --shallow-dolt-clone。
    clone_depth: 1

market:
  name: "csi300"           # 股票池: csi300 | csi500 | all
  candidates: ["csi300", "csi500", "csi800", "csi1000", "csiall", "all"]
  benchmark: "SH000300"    # 基准指数

strategy:
  topk_dropout:
    topk: 10
    n_drop: 3
    hold_thresh: 5
  universe_filter:
    exclude_kcb: true
    exclude_list: []
    min_price: 3

backtest:
  account: 1000000
  open_cost: 0.0005
  close_cost: 0.0015
  min_cost: 5
  start_time: "2024-01-01"
  # 给完全相同的模型分数加极小确定性扰动，减少选股排序漂移。
  tie_breaker_epsilon: 1.0e-12

daily_rebalance:
  # 每天收盘后由 launchd 在 20:00 调用 run_scheduled_rebalance.py。
  # 真实模式会从该日期开始重放 TopkDropout 回测，保证每日调仓信号来自同一固定起点。
  start_date: "2024-01-01"
  market: "csi1000"
  topk: 15
  n_drop: 3
  hold_thresh: 5
  account: 1000000
  model_path: ""           # 可填 models/*.pkl；为空时使用 experiment.latest_recorder_id
  notify_channel: "bark"   # bark | all
  notify_on_skip: false    # 非交易日默认不推送
  create_update_tarball: false
  cache_dir: "signals/daily_rebalance_cache"
  reminder_rebuild_on_miss: true

signal:
  postprocess:
    enabled: true
    # rank: 每日横截面分位数；zscore: 每日横截面标准分；none: 原始分数
    daily_transform: "rank"
    rank_pct: true
    # 行业中性化会使用 SectorDataProvider；默认关闭，避免强制依赖行业缓存/网络。
    industry_neutralize: false
    min_group_size: 5
  diagnostics:
    enabled: true
    horizon: 5

training:
  fit_start:   "2015-01-01"
  fit_end:     "2021-12-31"
  valid_start: "2022-01-01"
  valid_end:   "2023-12-31"
  test_start:  "2024-01-01"

experiment:
  name: "tutorial_exp"
  uri: "./mlruns"

  # ── 模型加载（两种方式二选一）────────────────────────────────
  #
  # 方式 1: qlib-native 训练（--qlib-native）后自动生成的 MLflow Recorder ID
  #   训练后会打印: "→ Set experiment.latest_recorder_id = ..."
  latest_recorder_id: ""   # e.g. "3a339927f5f946f38a9b6bfbaeb8d463"
  #
  # 方式 2: 自定义模型（--model lgbm/xgb/ridge/lasso）保存的 .pkl 文件
  #   通过 CLI 指定: python run_backtest.py --model-path models/lgbm_baseline_20260308_143021.pkl
  #   通过 CLI 指定: python run_daily.py    --model-path models/lgbm_sector_full_20260308_143021.pkl

data_cache:
  dir: "./cache"
  sector_ttl_days: 7        # 板块数据缓存有效天数（akshare 获取的行业数据）

paths:
  model_dir: "./models"
  signal_dir: "./signals"
  log_dir: "./logs"
  backtest_results_dir: "./backtest_results"
  optimization_dir: "./optimization_results"
