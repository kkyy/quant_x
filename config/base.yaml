# ============================================================
# Base Configuration - quant_ex
# 修改这里来配置你的数据路径、市场和实验设置
# ============================================================

qlib:
  provider_uri: "/Users/weidian/code/algorithms/investment_data/qlib_data/qlib_bin"
  region: "cn"

market:
  name: "csi300"           # 股票池: csi300 | csi500 | all
  benchmark: "SH000300"    # 基准指数

training:
  fit_start:   "2015-01-01"
  fit_end:     "2021-12-31"
  valid_start: "2022-01-01"
  valid_end:   "2023-12-31"
  test_start:  "2024-01-01"

experiment:
  name: "tutorial_exp"
  uri: "./mlruns"

  # ── 模型加载（两种方式二选一）────────────────────────────────
  #
  # 方式 1: qlib-native 训练（--qlib-native）后自动生成的 MLflow Recorder ID
  #   训练后会打印: "→ Set experiment.latest_recorder_id = ..."
  latest_recorder_id: ""   # e.g. "3a339927f5f946f38a9b6bfbaeb8d463"
  #
  # 方式 2: 自定义模型（--model lgbm/xgb/ridge/lasso）保存的 .pkl 文件
  #   通过 CLI 指定: python run_backtest.py --model-path models/lgbm_baseline_20260308_143021.pkl
  #   通过 CLI 指定: python run_daily.py    --model-path models/lgbm_sector_full_20260308_143021.pkl

data_cache:
  dir: "./cache"
  sector_ttl_days: 7        # 板块数据缓存有效天数（akshare 获取的行业数据）

paths:
  model_dir: "./models"
  signal_dir: "./signals"
  log_dir: "./logs"
  backtest_results_dir: "./backtest_results"
  optimization_dir: "./optimization_results"
