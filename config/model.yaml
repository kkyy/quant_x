# ============================================================
# Model Configuration
# ============================================================

model:
  # ── Active model ────────────────────────────────────────────
  # Model registry key. Available: lgbm | xgb | ridge | lasso
  # Override from CLI: python run_train.py --model xgb
  type: "lgbm"

  # ── qlib handler ─────────────────────────────────────────────
  handler:
    class: "Alpha158"
    module_path: "qlib.contrib.data.handler"

  # ── LightGBM hyper-parameters ────────────────────────────────
  lightgbm:
    n_estimators: 1000
    learning_rate: 0.05
    max_depth: 8
    num_leaves: 64
    min_child_samples: 50
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 0.1
    seed: 42
    feature_fraction_seed: 42
    bagging_seed: 42
    data_random_seed: 42
    extra_seed: 42
    deterministic: true
    force_col_wise: true
    early_stopping_rounds: 50
    verbose: -1
    # num_threads: -1 uses all logical cores (Apple M3 has 8).
    # When running parallel grid-search workers (--grid-workers N) or
    # walk-forward (--workers N), consider setting num_threads to
    # total_cores / N so workers don't compete, e.g. num_threads: 4.
    num_threads: -1
    # ── GPU acceleration (Phase 2) ────────────────────────────────────────────
    # device_type: "cpu"  ← default; numpy already uses Apple Accelerate (AMX).
    #
    # To enable M3 GPU via OpenCL/Metal:
    #   brew install opencl-headers ocl-icd
    #   git clone --recursive https://github.com/microsoft/LightGBM
    #   cd LightGBM && mkdir build && cd build
    #   cmake .. -DUSE_GPU=1 \
    #     -DOpenCL_LIBRARY=/System/Library/Frameworks/OpenCL.framework/OpenCL
    #   make -j$(sysctl -n hw.physicalcpu)
    #   cd ../python-package && pip install -e .  --force-reinstall
    #   Then change device_type to "gpu" below.
    device_type: "cpu"

  # ── Multi-seed ensemble ─────────────────────────────────────
  # 多 seed bagging 可以降低单次训练的随机性，但训练耗时会按 seed 数近似放大。
  ensemble:
    enabled: false
    seeds: [42, 123, 2024]

  # ── XGBoost hyper-parameters ─────────────────────────────────
  xgboost:
    n_estimators: 1000
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    reg_alpha: 0.1
    reg_lambda: 1.0
    min_child_weight: 30
    tree_method: "hist"
    verbosity: 0
    n_jobs: -1
    early_stopping_rounds: 50

  # ── Linear model hyper-parameters ────────────────────────────
  linear:
    alpha: 1.0     # used for both ridge and lasso

  # ── MLP (neural network) hyper-parameters ─────────────────────
  # Requires: pip install torch
  # On Apple M3, automatically uses MPS (Metal GPU) when available.
  # Usage: python run_train.py --model mlp --tag mlp_baseline
  mlp:
    hidden_dims: [256, 128, 64]
    dropout: 0.2
    batch_norm: true
    lr: 0.001
    weight_decay: 0.0001
    batch_size: 2048
    max_epochs: 100
    patience: 10
    seed: 42
    device: "auto"   # "auto" → mps > cuda > cpu; or "cpu" / "mps" / "cuda"

  # ── Factor pipeline ──────────────────────────────────────────
  # 定义哪些额外因子供应商参与训练特征构建。
  # 每个 entry 的 name 必须对应 FactorRegistry 注册的 key。
  # 其余字段作为该因子 __init__ 的 kwargs 传入。
  #
  # 内置因子:
  #   technical → TechnicalFactorEngine  (无需额外数据)
  #   sector    → SectorFactorEngine     (需要 --with-sector 激活板块数据加载)
  #   mined     → MinedFactorLoader      (需要预先运行 run_factor_mining.py)
  #
  # 注意: sector 因子会自动注入 sector_map（东方财富行业, 497个板块）
  #       和 concept_map（东方财富概念, 468个板块），无需在此配置。
  #       需要在训练时加 --with-sector 标志才会生效。
  #
  # 消融实验示例:
  #   python run_train.py --model lgbm --tag baseline          # 仅技术因子
  #   python run_train.py --model lgbm --tag sector_only \
  #     --with-sector                                          # 技术+板块因子
  features:
    factors:
      # 技术因子（始终启用）
      - name: "technical"
        ma_pairs: [[5, 20], [10, 60]]
        rsi_windows: [14, 20]
        bb_windows: [20]
        atr_windows: [14]
        obv_windows: [10, 20]
        vwap_windows: [5, 10, 20]

      # 板块轮动因子 — 取消注释后配合 --with-sector 使用
      # 生成的特征:
      #   sector_mom_{5,10,20,60}d   行业动量
      #   sector_rel_{5,10,20,60}d   行业相对强度（vs 全市场）
      #   stock_vs_sector_{5,20}d    个股超额（vs 行业）
      #   sector_rev_{5,20}d         行业反转
      #   sector_vol_{10,20}d        行业波动率
      #   sector_id                  行业编号（LightGBM categorical）
      #   concept_mom_{5,10,20}d     概念动量
      #   concept_rel_{5,10}d        概念相对强度
      #   concept_id                 概念编号
      # - name: "sector"
      #   momentum_windows: [5, 10, 20, 60]
      #   reversal_windows: [5, 20]

      # 挖掘因子 — 取消注释后需先运行 run_factor_mining.py
      # - name: "mined"
      #   path: "./cache/mined_factors.json"
      #   top_n: 20

      # 北向资金因子 — 取消注释以启用
      # 生成的特征:
      #   nb_hold_pct             北向持股占流通股比
      #   nb_hold_mv              北向持股市值
      #   nb_net_buy_ratio        北向净买入占比
      #   nb_hold_pct_chg_{w}d    持股占比 w 日变化量
      #   nb_net_buy_ma_{w}d      w 日净买入均值
      #   nb_sector_hold_pct      行业北向持股占比均值
      #   nb_vs_sector_{w}d       个股 vs 行业北向持股变化
      # - name: "northbound"
      #   windows: [5, 10, 20, 60]
      #   include_raw: true
      #   include_change: true

      # 基本面因子 — 取消注释以启用扩展指标
      # metrics 支持分组名和单独列名:
      #   valuation:     pe_ttm, pb, ps_ttm, dyr
      #   profitability: roe, roa, gross_margin, net_margin
      #   growth:        revenue_growth, profit_growth
      #   cashflow:      ocf_to_np, fcy_yield
      # 变化量: roe_chg, margin_chg, rev_accel (include_change=true)
      # - name: "fundamental"
      #   metrics: ["valuation", "profitability", "growth", "cashflow"]
      #   include_change: true

      # ── 新增外部因子（取消注释以启用）────────────────────────────────

      # 股权质押因子
      # 生成的特征:
      #   pledge_ratio        质押比例
      #   pledge_ratio_chg    质押比例变化
      # - name: "pledge"
      #   include_change: true

      # 融资融券因子
      # 生成的特征:
      #   margin_balance_chg_pct     融资余额变化率
      #   short_sell_ratio           融券占比
      #   margin_balance_chg_{w}d    w日融资余额变化
      # - name: "margin"
      #   include_change: true
      #   windows: [5, 10, 20]

      # 高管增减持因子
      # 生成的特征:
      #   insider_net_buy_pct_{w}d   w日高管净买入占比
      #   insider_buy_count_{w}d     w日高管增持次数
      #   insider_sell_count_{w}d    w日高管减持次数
      # - name: "insider"
      #   windows: [5, 20, 60]

      # 分析师预测因子
      # 生成的特征:
      #   analyst_coverage       研报覆盖数
      #   buy_rating_ratio       买入+增持占比
      #   consensus_eps_growth   一致预期EPS增速
      # - name: "analyst"

      # 股东户数因子
      # 生成的特征:
      #   sh_count               股东户数
      #   sh_count_chg_pct       户数变化率（减少=集中=看多）
      #   sh_per_share_holding_change  户均持股变化
      # - name: "shareholder"
      #   include_change: true

      # 分红因子
      # 生成的特征:
      #   div_yield_ttm          过去12个月股息率
      #   div_consistency        连续分红年数
      #   div_growth_rate        分红增长率
      # - name: "dividend"
      #   lookback_years: 5

      # 估值因子（含市值绝对值、PEG、市现率）
      # 生成的特征:
      #   market_cap             总市值（绝对值）
      #   float_market_cap       流通市值（绝对值）
      #   pe_ttm, pb, ps_ttm     估值比率（日频）
      #   peg, pcf               PEG、市现率
      # - name: "valuation"
      #   include_change: false

      # 资产负债表因子（含营收/利润/资产绝对值）
      # 生成的特征:
      #   leverage_ratio         杠杆率(负债/权益)
      #   current_ratio          流动比率
      #   quick_ratio            速动比率
      #   goodwill_to_equity     商誉/净资产
      #   net_debt_ratio         净负债率
      #   revenue                营业收入（绝对值）
      #   net_profit             净利润（绝对值）
      #   total_assets           总资产（绝对值）
      #   total_equity           净资产（绝对值）
      # - name: "balance_sheet"
      #   include_change: false

      # 业绩预告因子
      # 生成的特征:
      #   guidance_type          预告类型(预增=3,首亏=-3等)
      #   earnings_surprise_pct  业绩预期变化幅度
      # - name: "earnings_guidance"

      # 机构持仓因子
      # 生成的特征:
      #   fund_hold_count        持有基金家数
      #   fund_hold_count_chg    基金家数变化
      #   qfii_hold_flag         QFII持仓标志
      #   qfii_new_entry         QFII新进标志
      #   ss_hold_flag           社保持仓标志
      # - name: "institutional"
      #   include_change: true

      # 回购因子
      # 生成的特征:
      #   repurchase_completion_pct  回购完成度
      #   repurchase_active          回购进行中标志
      # - name: "repurchase"

      # 机构调研因子
      # 生成的特征:
      #   visit_count_30d        近30天调研次数
      #   visit_count_chg        调研次数变化
      # - name: "visit"
      #   lookback_days: 30

    # ── Legacy flags（已被 factors 列表取代，仍向下兼容）────────
    use_sector_factors: false
    sector_momentum_windows: [5, 10, 20, 60]
    sector_reversal_windows: [5, 20]
    use_mined_factors: false
    mined_factors_path: "./cache/mined_factors.json"
