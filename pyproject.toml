[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "quant_ex"
version = "0.1.0"
description = "A-share quantitative stock selection framework based on qlib + LightGBM (Alpha158)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["quantitative-finance", "stock-selection", "qlib", "lightgbm", "alpha158"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pyqlib>=0.9.1",
    "mlflow>=2.0.0",
    "setuptools-scm>=8.0.0",
    "lightgbm>=3.3.0",
    "akshare>=1.10.0",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "SQLAlchemy>=1.4.0",
    "PyMySQL>=1.0.0",
    "PyYAML>=6.0",
    "requests>=2.28.0",
    "python-dateutil>=2.8.0",
    "tqdm>=4.64.0",
]

[project.optional-dependencies]
ai = ["anthropic>=0.20.0"]
dev = ["pytest>=7.0", "black>=23.0", "ruff>=0.1.0"]

[project.scripts]
qx-train = "quant_ex.run_train:main"
qx-daily = "quant_ex.run_daily:main"
qx-backtest = "quant_ex.run_backtest:main"
qx-mine = "quant_ex.run_factor_mining:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_ex*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
